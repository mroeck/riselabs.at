# The four ways work with RISE actually starts.
#
# One source for two places: the "Work with us" band on the home page and the
# end of /expertise/. Written here rather than in either page, so the two
# cannot drift apart.
#
#   id        the anchor, and nothing else; keep it stable
#   title     the name of the way in, as it reads in the sentence
#   action    what the card's link says, and the subject line it prefills.
#             `title` names the reader's situation ("You hold building data");
#             `action` names what happens next ("Join a data programme"). A
#             button has to say what it does, and a subject line has to sort
#             the inbox, so neither can be the situation.
#   subject   the mail subject, normally the same as `action`
#   body      the description
#   examples  project slugs, two per card. They render as "For example: …",
#             each linked to its project page under its `short_title`.
#             docs-check.py fails a slug with no project behind it.
#
# The point of `examples` is that no card describes a service RISE has not
# done. Every one of these has at least two projects on this site behind it,
# so a visitor can check the claim in one click. If a card ever has no
# example to give, that is a reason to question the card, not to drop the
# line.
#
# These four replace an earlier set (commissioned work, research partnership,
# independent review, teaching and facilitation) which described four generic
# consulting modes. Two of them had no project on the site behind them, and
# the two ways most current work actually begins - a funder backing a
# programme RISE designs and runs, and a country or data initiative joining a
# shared data programme - were missing entirely. Wording from the review of
# 29 October 2026.
#
# The order here is the order both pages render, and it runs from the most
# self-contained engagement to the most open-ended.

- id: commission
  title: "You need a number you can defend"
  action: "Commission a study"
  subject: "Commission a study"
  body: >-
    Commission a baseline, benchmark, limit value or scenario study.
  examples:
    - supporting-the-development-of-a
    - analysis-of-life-cycle-greenhouse

- id: fund
  title: "You want change that outlasts a project"
  action: "Fund a programme"
  subject: "Fund a programme"
  body: >-
    Fund a programme that builds shared data and capacity, from pilot to self-sustaining.
  examples:
    - indicate
    - global-building-data-initiative

- id: join-data
  title: "You hold building data"
  action: "Join a data programme"
  subject: "Join a data programme"
  body: >-
    Join a data programme and publish comparable whole life carbon data for your country.
  examples:
    - indicate-life
    - chile-wlc-data-harmonisation

- id: research-advice
  title: "You are building a consortium or a curriculum"
  action: "Research and advice"
  subject: "Research and advice"
  body: >-
    Bring us in for research, advice, keynotes or training.
  examples:
    - iea-ebc-annex-72
    - global-status-report-for-buildings
