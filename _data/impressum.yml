# --- trade law ------------------------------------------------------------
#
# STILL TO CONFIRM - the one thing the company document does not settle.
#
# Being registered as an e.U. does not by itself mean the activity is a
# Gewerbe. Pure research can fall outside the Gewerbeordnung as "Neue
# Selbständige". But the company document describes RISE as a "research and
# consulting firm", and paid consulting is normally a Gewerbe - usually
# Unternehmensberatung. If it is, then three things are mandatory here:
# the Gewerbe, the supervisory authority, and WKO membership (which follows
# automatically from holding a Gewerbe).
#
# One question to your accountant or the WKO. If the answer is yes,
# uncomment the three lines below; the authority is fixed by the 1090
# address. If the answer is no, leave them blank - stating them would be
# wrong - and either way set trade_law_checked to true to clear the notice.

# Set true on your assessment that the work does not fall under the
# Gewerbeordnung - research rather than a regulated trade. Provisional
# until your accountant confirms it. If the answer comes back the other
# way, uncomment the three lines below and the section reappears.
trade_law_checked: true

gewerbe: ""
# gewerbe: "Unternehmensberatung einschließlich Unternehmensorganisation"
gewerbebehoerde: ""
# gewerbebehoerde: "Magistratisches Bezirksamt für den 9. Bezirk"
wko: ""
# wko: "Wirtschaftskammer Wien"
berufsrecht_url: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10007517"

# --- media law (MedienG §25) ----------------------------------------------

# Unternehmensgegenstand - business purpose. Drawn from the company
# description so the two documents say the same thing.
purpose: >-
  Forschung und Beratung zur Transformation hin zu regenerativen Systemen
  räumlicher Produktion. Quantitative Lebenszyklus-Nachhaltigkeitsbewertung
  (LCSA) von Gebäuden und Infrastruktur sowie Beratung von Politik und
  Industrie auf dieser Grundlage.

# Blattlinie - basic editorial direction, required once a site publishes
# beyond self-presentation.
blattlinie: >-
  Information über die Forschungstätigkeit, Projekte und Publikationen von
  RISE sowie über wissenschaftliche und politische Entwicklungen zu
  Klimaschutz, Ressourcennutzung und Transformation im Gebäudesektor.

# Beteiligungsverhältnisse - ownership.
