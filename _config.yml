title: RISE
tagline: towards regenerative spatial systems
description: >-
  RISE is a research institute in Vienna working on how the built environment
  can operate within planetary boundaries - and what has to change to get there.

url: "https://riselabs.at"
baseurl: ""
lang: en

email: office@riselabs.at
linkedin: "https://www.linkedin.com/company/riseregenerate/"
bluesky: "https://bsky.app/profile/riselabs.at"
scholar: "https://scholar.google.com/citations?user=v0Pwb1cAAAAJ&hl=de"

# The picture shown when a page is shared on LinkedIn, Bluesky or anywhere
# else that reads Open Graph. jekyll-seo-tag turns this into an absolute
# https URL from `url` above.
#
# A page with its own picture sets `image:` next to `hero:`; see docs/03.
# That is deliberately a second field rather than derived from `hero`,
# because jekyll-seo-tag only reads `image` and hand-writing the meta tags
# here would duplicate the ones the plugin already emits.
image: /assets/img/social/rise-default.png

# Every page has an image, so the large card is always the right one.
twitter:
  card: summary_large_image

# Underlined automatically wherever it appears in a publication line.
author_cite: "Röck M"

# Setting this makes the "Datenschutz" link appear in the footer and the
# data-protection section appear at the foot of the Impressum.
privacy_url: "/datenschutz/"

# The team page is hidden for now: the team is still forming and the page was
# thin. Nothing has been deleted. To bring it back: set this to true, remove
# `published: false` from team.md, put the Team entry back in `nav` below, and
# remove `published: false` from the people in _people/ who are ready.
team_page: false

# Newsletter. Two different URLs, doing two different jobs:
#   newsletter_url    = the public Buttondown page - renders a button
#   newsletter_action = the API embed endpoint - renders a form on the page
# Set either or both. With both, the form shows and the page link sits under
# it. Comment both out and the block falls back to an email link.
# newsletter_url: "https://buttondown.com/riseregenerate"
newsletter_action: "https://buttondown.com/api/emails/embed-subscribe/riseregenerate"

# Navigation.
#
# Two shapes are allowed. A top-level entry with a `url` is a plain link; one
# with `items` is a group that opens a panel. Groups keep the bar to five
# words, which is what stopped it wrapping onto two lines on a phone.
#
# Home is deliberately present and deliberately skipped by the header - the
# logo is the link home. It stays here because other includes read this list.
nav:
  - title: Home
    url: /
  - title: About
    items:
      - title: Approach
        url: /approach/
      - title: Expertise
        url: /expertise/
      - title: Partners
        url: /partners/
      # - title: Team     # hidden; see team_page above
      #   url: /team/
      - title: Join
        url: /join/
  - title: Work
    items:
      - title: Projects
        url: /projects/
      - title: Publications
        url: /publications/
      - title: Data & tools
        url: /tools/
  - title: Media
    items:
      - title: News
        url: /news/
      - title: Events
        url: /events/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /news/:year/:title/

# Each file in _projects/ becomes its own page at /projects/<filename>/
collections:
  projects:
    output: true
    permalink: /projects/:name/
  people:
    output: true
    permalink: /team/:name/
  publications:
    output: true
    permalink: /publications/:name/
  partners:
    output: true
    permalink: /partners/:name/

# Which layout each kind of content uses.
#
# This block is load-bearing. Without it the files in _projects, _people,
# _publications and _partners have no layout at all, and Jekyll renders their
# raw content with no stylesheet, no navigation and no header - which is
# exactly what happened on the first upload. Nothing in those files sets a
# layout individually, by design: the layout belongs to the collection.
defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "", type: "people" }
    values: { layout: "person" }
  - scope: { path: "", type: "publications" }
    values: { layout: "publication" }
  - scope: { path: "", type: "partners" }
    values: { layout: "partner" }
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs          # the guidance documents, not part of the public site
  - _preview      # local preview output, never published
  - docs-check.py    # site checker - tooling, not a page
  - make-figures.py  # redraws the CollaborativeCarbon charts
  - fetch-abstracts.py  # pulls abstracts from Zotero/Crossref
  - add-logos.py        # downloads and normalises partner logos
  - logo-sources.txt    # the list it reads
