---
layout: default
---
<div class="page-head wrap narrow">
  <p class="post-date">{% if page.type %}<span class="post-type">{{ page.type }}</span> &nbsp;·&nbsp; {% endif %}{{ page.date | date: "%d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
</div>

<main id="content">
<section class="band">
<div class="wrap narrow post-body">
  {{ content }}
  <p class="muted small" style="margin-top:2.5rem;"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
</div>
</section>
</main>
